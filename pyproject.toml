[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raptor-sim"
version = "0.1.0"
description = "Raptor-class methane engine design and verification model for solar system exploration studies"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rocketcea>=1.2",
    "cantera>=3.0",
    "optuna>=5.0",
    "CoolProp>=6.6",
    "ezdxf>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raptor_sim = ["components/design_point.json", "roadmap/overrides.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
